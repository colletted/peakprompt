<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>peak prompt</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="experience" data-view="path" data-mode="elevation" data-hike="path">
      <h1 class="title-overlay" id="page-title">grateful chasing summits</h1>

      <div id="viewport" class="viewport" aria-label="Hike along the Wikiloc path"></div>

      <div class="scroll-rail" id="scroll-rail" aria-hidden="true"></div>

      <p class="meta-chip meta-chip--top-left" id="meta-time" aria-live="polite">TIME</p>
      <p class="meta-chip meta-chip--top-right" id="meta-altitude" aria-live="polite">ELEVATION</p>

      <nav class="view-tabs" id="view-tabs" aria-label="Experience views">
        <button type="button" class="view-tab is-active" data-view="path" aria-pressed="true">
          1
        </button>
        <button type="button" class="view-tab" data-view="combine" aria-pressed="false">
          2
        </button>
      </nav>

      <p class="scroll-hint" id="scroll-hint">SCROLL TO BEGIN THE PASSAGE</p>
      <div class="journey-lyrics" id="journey-lyrics" aria-live="polite"></div>

      <p class="meta-chip meta-chip--bottom-left" id="meta-location" aria-live="polite">LAT LON</p>
      <p class="meta-chip meta-chip--bottom-right" id="meta-steps" aria-live="polite">0 STEPS</p>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
